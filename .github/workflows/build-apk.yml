name: Build Rustym APK

on:
  push:
    branches:
      - main
      - master
      - crossfade-test
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners ship a complete Android SDK already. The setup-android
      # action broke when the preinstalled cmdline-tools were bumped to 20.0 (it tries
      # to install the long-removed legacy "tools" package), so use the preinstalled
      # sdkmanager directly instead.
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Surface Kotlin compile errors as check annotations so they're readable
      # through the public checks API (the raw log needs login).
      - name: Surface compile errors
        if: failure()
        run: |
          grep -E "^e: |^Caused by:" build.log | head -12 | while IFS= read -r line; do
            echo "::error::$line"
          done
        continue-on-error: true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Rustym.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rustym-apk
          path: Rustym.apk
          if-no-files-found: error
          retention-days: 14

      # Tag pushes (v*) publish the APK as a GitHub release, with the notes from
      # release-notes.md in the repo. GITHUB_TOKEN is scoped to contents:write above.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Rustym.apk \
            --title "Rustym ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest
